[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "wise_bank_feed"
version = "0.3.1"
description = "Read-only Wise connector for ERPNext v16"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = ["requests>=2.31,<3"]

[project.urls]
Homepage = "https://github.com/GreatWharf/frappe-erpnext-wise"
Documentation = "https://github.com/GreatWharf/frappe-erpnext-wise/tree/main/docs"
Issues = "https://github.com/GreatWharf/frappe-erpnext-wise/issues"

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "ruff>=0.14", "build>=1,<2"]

[tool.setuptools.packages.find]
include = ["wise_bank_feed*"]
[tool.setuptools.package-data]
"*" = ["*.json", "*.js", "*.txt", "*.svg", "*.png"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
