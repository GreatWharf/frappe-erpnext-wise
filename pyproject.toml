[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "wise_bank_feed"
version = "0.1.0"
description = "Read-only Wise connector for ERPNext v16"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = ["requests>=2.31,<3"]
[tool.setuptools.packages.find]
include = ["wise_bank_feed*"]
[tool.setuptools.package-data]
"*" = ["*.json", "*.js", "*.txt", "*.svg"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
