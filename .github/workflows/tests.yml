name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install app and test tools
        run: python -m pip install . pytest==9.1.1 ruff==0.16.7 build
      - name: Test connector logic with offline Wise responses
        run: python -m pytest -q
      - name: Lint
        run: ruff check wise_bank_feed tests
      - name: Check Desk JavaScript
        run: find wise_bank_feed -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build distributions
        run: python -m build
