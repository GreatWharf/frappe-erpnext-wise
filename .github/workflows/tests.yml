name: Tests and package
on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install app and declared test tools
        run: python -m pip install -e '.[test]'
      - name: Test connector logic with offline Wise responses
        run: python -m pytest -q
      - name: Test setup and connection actions
        run: node --test tests/test_ui.js
      - name: Lint
        run: ruff check wise_bank_feed tests scripts
      - name: Check Desk JavaScript
        run: find wise_bank_feed -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Build and verify distributions
        run: |
          python -m build
          python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        with:
          name: wise-distributions
          path: dist/*
